version: "1.0.0"
framework: "React"
target: "React 18+"

naming_conventions:
  components:
    - rule: "Use PascalCase for component names"
      example: "function UserProfile() { }"
  files:
    - rule: "Component files use PascalCase with .tsx extension"
      example: "UserProfile.tsx"
  hooks:
    - rule: "Custom hooks start with 'use' prefix"
      example: "function useUserData() { }"
  event_handlers:
    - rule: "Prefix with 'handle' or 'on'"
      example: "const handleClick = () => { }"
  props:
    - rule: "Use camelCase for prop names"
      example: "interface UserProps { userId: number; }"
  constants:
    - rule: "Use UPPER_SNAKE_CASE for constants"
      example: "const MAX_ITEMS = 100;"

component_structure:
  functional_components:
    - "Always use functional components over class components"
    - "Use React.FC or explicit return type"
    - "Destructure props in function parameters"
  hooks_order:
    - "useState hooks first"
    - "useEffect hooks second"
    - "useContext and other hooks third"
    - "Custom hooks last"
  component_organization:
    - "Interfaces and types at top"
    - "Component definition"
    - "Helper functions inside component"
    - "Export at bottom"

best_practices:
  hooks:
    - "Always follow rules of hooks"
    - "Use useCallback for function memoization"
    - "Use useMemo for expensive computations"
    - "Use useRef for DOM access and mutable values"
    - "Clean up effects with return function"
  props:
    - "Use TypeScript interfaces for props"
    - "Destructure props for clarity"
    - "Provide default props when appropriate"
    - "Use children prop type from React"
  state_management:
    - "Keep state close to where it's used"
    - "Lift state up when needed by multiple components"
    - "Use Context API for global state"
    - "Consider Redux or Zustand for complex state"
  performance:
    - "Use React.memo for expensive components"
    - "Avoid inline object/array creation in JSX"
    - "Use key prop correctly in lists"
    - "Lazy load components with React.lazy"
  jsx:
    - "Keep JSX readable and simple"
    - "Extract complex JSX into sub-components"
    - "Use fragments to avoid unnecessary divs"
    - "Use semantic HTML elements"

patterns:
  custom_hooks:
    - "Extract reusable logic into custom hooks"
    - "Name starts with 'use'"
    - "Follow hooks rules"
  composition:
    - "Favor composition over inheritance"
    - "Use children prop for flexible components"
    - "Use render props when appropriate"
  error_boundaries:
    - "Wrap components with error boundaries"
    - "Provide fallback UI for errors"
  conditional_rendering:
    - "Use ternary for simple conditions"
    - "Use && for single branch"
    - "Extract complex conditions into variables"

state_management:
  local_state:
    - "Use useState for component-level state"
    - "Use useReducer for complex state logic"
  context:
    - "Use Context API for global state"
    - "Create separate contexts for different concerns"
    - "Memoize context values"
  external_libraries:
    - "Redux for complex global state"
    - "Zustand for simpler state management"
    - "React Query for server state"

styling:
  approaches:
    - "CSS Modules for scoped styles"
    - "Styled-components for CSS-in-JS"
    - "Tailwind CSS for utility-first"
    - "Avoid inline styles except for dynamic values"
  organization:
    - "One style file per component"
    - "Use consistent naming convention"
    - "Group related styles together"

testing:
  - "Use React Testing Library"
  - "Test user behavior, not implementation"
  - "Use screen queries from @testing-library/react"
  - "Mock external dependencies"
  - "Test accessibility with jest-axe"

accessibility:
  - "Use semantic HTML elements"
  - "Provide alt text for images"
  - "Use ARIA labels when needed"
  - "Ensure keyboard navigation works"
  - "Test with screen readers"

security:
  - "Sanitize user input before rendering"
  - "Use dangerouslySetInnerHTML sparingly"
  - "Validate data from APIs"
  - "Implement proper authentication"
  - "Use environment variables for secrets"

documentation:
  - "Document complex components with JSDoc"
  - "Provide prop types documentation"
  - "Include usage examples"
  - "Document custom hooks behavior"
