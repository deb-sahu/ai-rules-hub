# React AI Coding Standards

version: "1.0.0"
language: "typescript"
framework: "react"

rules:
  component_structure:
    - rule: "Use functional components with hooks instead of class components"
      priority: "high"
      example: "const UserProfile: React.FC<UserProfileProps> = ({ user }) => { }"
    
    - rule: "Use PascalCase for component names"
      priority: "high"
      example: "const UserDashboard = () => { }"
    
    - rule: "One component per file, file name matches component name"
      priority: "high"
      
    - rule: "Organize component files: ComponentName.tsx, ComponentName.module.css, ComponentName.test.tsx"
      priority: "medium"

  props_and_types:
    - rule: "Define explicit TypeScript interfaces/types for component props"
      priority: "high"
      example: "interface ButtonProps { label: string; onClick: () => void; disabled?: boolean; }"
    
    - rule: "Use destructuring for props"
      priority: "high"
      example: "const Button = ({ label, onClick, disabled = false }: ButtonProps) => { }"
    
    - rule: "Provide default values for optional props"
      priority: "medium"
      
    - rule: "Use React.FC or explicit return types for components"
      priority: "medium"

  hooks_usage:
    - rule: "Follow the Rules of Hooks (only call at top level, only in React functions)"
      priority: "critical"
      
    - rule: "Use useState for local component state"
      priority: "high"
      example: "const [count, setCount] = useState<number>(0);"
    
    - rule: "Use useEffect for side effects with proper cleanup"
      priority: "high"
      example: "useEffect(() => { const subscription = subscribe(); return () => subscription.unsubscribe(); }, []);"
    
    - rule: "Include all dependencies in useEffect, useCallback, useMemo dependency arrays"
      priority: "high"
      
    - rule: "Extract complex logic into custom hooks"
      priority: "medium"
      example: "const { data, loading, error } = useFetchUser(userId);"
    
    - rule: "Use useCallback for functions passed as props to prevent re-renders"
      priority: "medium"
      
    - rule: "Use useMemo for expensive computations"
      priority: "medium"

  state_management:
    - rule: "Keep state as local as possible, lift up when necessary"
      priority: "high"
      
    - rule: "Use Context API for global state (theme, auth, etc.)"
      priority: "medium"
      example: "const { user } = useContext(AuthContext);"
    
    - rule: "Consider state management libraries (Redux, Zustand, Jotai) for complex apps"
      priority: "low"

  rendering_optimization:
    - rule: "Use React.memo for pure components to prevent unnecessary re-renders"
      priority: "medium"
      example: "export const UserCard = React.memo<UserCardProps>(({ user }) => { });"
    
    - rule: "Avoid inline function definitions in JSX for frequently rendered components"
      priority: "medium"
      
    - rule: "Use key prop correctly for list items (stable, unique identifiers)"
      priority: "high"
      example: "<li key={user.id}>{user.name}</li>"
    
    - rule: "Lazy load components with React.lazy and Suspense"
      priority: "medium"
      example: "const Dashboard = React.lazy(() => import('./Dashboard'));"

  jsx_best_practices:
    - rule: "Use fragments (<></>) to avoid unnecessary div wrappers"
      priority: "medium"
      
    - rule: "Use conditional rendering appropriately (&&, ternary, early returns)"
      priority: "high"
      example: "{isLoading ? <Spinner /> : <Content />}"
    
    - rule: "Extract complex JSX into separate components"
      priority: "medium"
      
    - rule: "Use semantic HTML elements"
      priority: "medium"

  event_handling:
    - rule: "Use arrow functions or useCallback for event handlers"
      priority: "high"
      example: "const handleClick = useCallback(() => { }, []);"
    
    - rule: "Prevent default behavior explicitly when needed"
      priority: "medium"
      example: "const handleSubmit = (e: React.FormEvent) => { e.preventDefault(); };"
    
    - rule: "Type event handlers correctly"
      priority: "high"
      example: "onChange: (e: React.ChangeEvent<HTMLInputElement>) => void"

  forms:
    - rule: "Use controlled components for form inputs"
      priority: "high"
      example: "<input value={name} onChange={(e) => setName(e.target.value)} />"
    
    - rule: "Consider form libraries (React Hook Form, Formik) for complex forms"
      priority: "medium"
      
    - rule: "Validate form input and provide user feedback"
      priority: "high"

  styling:
    - rule: "Use CSS Modules, styled-components, or Tailwind CSS consistently"
      priority: "medium"
      
    - rule: "Avoid inline styles except for dynamic values"
      priority: "medium"
      
    - rule: "Follow a consistent naming convention for CSS classes"
      priority: "medium"

  testing:
    - rule: "Write tests using React Testing Library"
      priority: "high"
      
    - rule: "Test user interactions, not implementation details"
      priority: "high"
      example: "fireEvent.click(getByRole('button', { name: /submit/i }));"
    
    - rule: "Use data-testid sparingly, prefer accessible queries"
      priority: "medium"

  accessibility:
    - rule: "Use semantic HTML and ARIA attributes"
      priority: "high"
      
    - rule: "Ensure keyboard navigation works"
      priority: "high"
      
    - rule: "Provide alt text for images"
      priority: "high"
      
    - rule: "Maintain proper heading hierarchy"
      priority: "medium"

  security:
    - rule: "Sanitize user input to prevent XSS attacks"
      priority: "critical"
      
    - rule: "Avoid dangerouslySetInnerHTML unless absolutely necessary"
      priority: "critical"
      
    - rule: "Store sensitive data securely, not in component state"
      priority: "critical"

ai_completion_hints:
  - "Suggest appropriate React hooks for the use case"
  - "Recommend performance optimizations when needed"
  - "Provide accessibility attributes (aria-label, role, etc.)"
  - "Suggest proper error boundaries for error handling"
  - "Recommend appropriate state management patterns"
