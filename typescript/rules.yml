# TypeScript AI Coding Standards

version: "1.0.0"
language: "typescript"

rules:
  naming_conventions:
    - rule: "Use PascalCase for types, interfaces, classes, and enums"
      priority: "high"
      example: "interface UserProfile { } class UserService { }"
    
    - rule: "Use camelCase for variables, functions, and methods"
      priority: "high"
      example: "const userName = 'John'; function getUserById(id: number)"
    
    - rule: "Use UPPER_SNAKE_CASE for constants"
      priority: "medium"
      example: "const MAX_RETRY_COUNT = 3;"
    
    - rule: "Prefix interfaces with 'I' only when necessary for clarity"
      priority: "low"
      example: "interface User { } or interface IUserRepository { }"

  type_safety:
    - rule: "Always define explicit types for function parameters and return values"
      priority: "high"
      example: "function getUser(id: number): Promise<User | null>"
    
    - rule: "Avoid using 'any' type, use 'unknown' when type is truly unknown"
      priority: "high"
      example: "function processData(data: unknown): void"
    
    - rule: "Use strict null checks and handle undefined/null cases"
      priority: "high"
      example: "const userName: string | null = user?.name ?? null;"
    
    - rule: "Prefer type over interface for unions and intersections"
      priority: "medium"
      example: "type Status = 'active' | 'inactive' | 'pending';"

  code_organization:
    - rule: "One export per file for major components/classes"
      priority: "medium"
      
    - rule: "Group imports: external libraries, internal modules, types"
      priority: "medium"
      
    - rule: "Use barrel exports (index.ts) for cleaner imports"
      priority: "low"

  best_practices:
    - rule: "Use async/await instead of raw promises"
      priority: "high"
      example: "const user = await fetchUser(id);"
    
    - rule: "Prefer const over let, avoid var completely"
      priority: "high"
      example: "const userName = 'John';"
    
    - rule: "Use optional chaining and nullish coalescing"
      priority: "medium"
      example: "const city = user?.address?.city ?? 'Unknown';"
    
    - rule: "Destructure objects and arrays when accessing multiple properties"
      priority: "medium"
      example: "const { firstName, lastName } = user;"
    
    - rule: "Use arrow functions for callbacks and functional programming"
      priority: "medium"
      example: "users.map(user => user.name)"

  error_handling:
    - rule: "Always handle promise rejections"
      priority: "high"
      example: "try { await fetchData(); } catch (error) { handleError(error); }"
    
    - rule: "Create custom error types for domain-specific errors"
      priority: "medium"
      example: "class ValidationError extends Error { }"
    
    - rule: "Use type guards to narrow error types"
      priority: "medium"
      example: "if (error instanceof ValidationError) { }"

  testing:
    - rule: "Write unit tests using Jest, Vitest, or Mocha"
      priority: "high"
      
    - rule: "Mock external dependencies in tests"
      priority: "high"
      
    - rule: "Use descriptive test names with 'should' or 'it' patterns"
      priority: "medium"
      example: "it('should return user when ID exists')"

  performance:
    - rule: "Avoid unnecessary type assertions"
      priority: "medium"
      
    - rule: "Use lazy loading for large modules"
      priority: "medium"
      example: "const module = await import('./heavy-module');"
    
    - rule: "Memoize expensive computations"
      priority: "low"

  security:
    - rule: "Sanitize user input before processing"
      priority: "critical"
      
    - rule: "Use environment variables for sensitive configuration"
      priority: "critical"
      
    - rule: "Avoid eval() and Function() constructor"
      priority: "critical"

ai_completion_hints:
  - "Suggest appropriate generics for reusable functions"
  - "Recommend utility types (Pick, Omit, Partial, Required)"
  - "Provide JSDoc comments for complex functions"
  - "Suggest appropriate design patterns"
  - "Recommend type narrowing techniques"
