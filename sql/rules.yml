# SQL AI Coding Standards

version: "1.0.0"
language: "sql"

rules:
  naming_conventions:
    - rule: "Use lowercase with underscores for table and column names (snake_case)"
      priority: "high"
      example: "CREATE TABLE user_profiles (user_id INT, first_name VARCHAR(50));"
    
    - rule: "Use singular names for tables"
      priority: "medium"
      example: "user, order, product (not users, orders, products)"
    
    - rule: "Prefix primary keys with table name"
      priority: "medium"
      example: "user_id, order_id, product_id"
    
    - rule: "Use descriptive names, avoid abbreviations"
      priority: "high"
      example: "customer_address (not cust_addr)"

  schema_design:
    - rule: "Define primary keys for all tables"
      priority: "critical"
      example: "user_id INT PRIMARY KEY"
    
    - rule: "Use foreign keys to enforce referential integrity"
      priority: "high"
      example: "FOREIGN KEY (user_id) REFERENCES user(user_id)"
    
    - rule: "Normalize data to at least 3NF to reduce redundancy"
      priority: "high"
      
    - rule: "Use appropriate data types (avoid VARCHAR(MAX) when size is known)"
      priority: "high"
      
    - rule: "Set NOT NULL constraints where applicable"
      priority: "high"
      
    - rule: "Use indexes on frequently queried columns"
      priority: "high"
      example: "CREATE INDEX idx_user_email ON user(email);"

  query_writing:
    - rule: "Use explicit column names instead of SELECT *"
      priority: "high"
      example: "SELECT user_id, first_name, last_name FROM user"
    
    - rule: "Use uppercase for SQL keywords"
      priority: "medium"
      example: "SELECT, FROM, WHERE, JOIN, ORDER BY"
    
    - rule: "Always use table aliases in joins for clarity"
      priority: "high"
      example: "SELECT u.user_id, o.order_id FROM user u JOIN order o ON u.user_id = o.user_id"
    
    - rule: "Use INNER JOIN instead of implicit joins (comma-separated tables)"
      priority: "high"
      
    - rule: "Place JOIN conditions in ON clause, filter conditions in WHERE clause"
      priority: "high"
      example: "FROM user u JOIN order o ON u.user_id = o.user_id WHERE o.status = 'completed'"

  performance:
    - rule: "Use EXISTS instead of COUNT(*) > 0 for existence checks"
      priority: "medium"
      example: "WHERE EXISTS (SELECT 1 FROM order WHERE user_id = u.user_id)"
    
    - rule: "Avoid functions on indexed columns in WHERE clauses"
      priority: "high"
      example: "Bad: WHERE YEAR(created_date) = 2024; Good: WHERE created_date >= '2024-01-01'"
    
    - rule: "Use UNION ALL instead of UNION when duplicates are acceptable"
      priority: "medium"
      
    - rule: "Limit result sets with TOP/LIMIT for large queries"
      priority: "high"
      
    - rule: "Use appropriate JOIN types (INNER, LEFT, RIGHT, FULL)"
      priority: "high"

  data_modification:
    - rule: "Always use WHERE clause with UPDATE and DELETE statements"
      priority: "critical"
      example: "UPDATE user SET status = 'inactive' WHERE user_id = 123;"
    
    - rule: "Use transactions for multiple related DML operations"
      priority: "high"
      example: "BEGIN TRANSACTION; UPDATE...; INSERT...; COMMIT;"
    
    - rule: "Use parameterized queries to prevent SQL injection"
      priority: "critical"
      
    - rule: "Include error handling in stored procedures"
      priority: "high"

  stored_procedures:
    - rule: "Use clear, descriptive names with prefix (sp_, usp_)"
      priority: "medium"
      example: "CREATE PROCEDURE usp_GetUserOrders"
    
    - rule: "Include input validation"
      priority: "high"
      
    - rule: "Document parameters and return values"
      priority: "medium"
      
    - rule: "Use SET NOCOUNT ON to improve performance"
      priority: "medium"

  views:
    - rule: "Use views to encapsulate complex queries"
      priority: "medium"
      example: "CREATE VIEW vw_ActiveUsers AS SELECT ... WHERE status = 'active'"
    
    - rule: "Prefix view names with 'vw_' or 'v_'"
      priority: "medium"
      
    - rule: "Avoid nested views for performance"
      priority: "medium"

  functions:
    - rule: "Use scalar functions for single value returns"
      priority: "medium"
      
    - rule: "Use table-valued functions for result sets"
      priority: "medium"
      
    - rule: "Prefix function names appropriately (fn_, udf_)"
      priority: "medium"

  triggers:
    - rule: "Use triggers sparingly, document their purpose"
      priority: "high"
      
    - rule: "Keep trigger logic simple and fast"
      priority: "high"
      
    - rule: "Avoid recursive triggers"
      priority: "high"

  security:
    - rule: "Never store sensitive data in plain text (use encryption)"
      priority: "critical"
      
    - rule: "Use parameterized queries/prepared statements to prevent SQL injection"
      priority: "critical"
      
    - rule: "Grant minimum necessary permissions (principle of least privilege)"
      priority: "critical"
      
    - rule: "Avoid dynamic SQL unless absolutely necessary"
      priority: "high"

  formatting:
    - rule: "Use consistent indentation (2 or 4 spaces)"
      priority: "medium"
      
    - rule: "Place each column on a new line in SELECT statements"
      priority: "low"
      
    - rule: "Align JOIN clauses for readability"
      priority: "low"

  comments:
    - rule: "Add comments for complex queries and business logic"
      priority: "medium"
      example: "-- Calculate total revenue for active customers"
    
    - rule: "Document assumptions and edge cases"
      priority: "medium"

ai_completion_hints:
  - "Suggest appropriate indexes for query optimization"
  - "Recommend query optimization techniques"
  - "Provide execution plan analysis hints"
  - "Suggest appropriate data types for columns"
  - "Recommend normalization or denormalization strategies"
