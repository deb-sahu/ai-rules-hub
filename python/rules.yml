# Python AI Coding Standards

version: "1.0.0"
language: "python"

rules:
  naming_conventions:
    - rule: "Use snake_case for function names and variable names"
      priority: "high"
      example: "def get_user_data(user_id): user_name = 'John'"
    
    - rule: "Use PascalCase for class names"
      priority: "high"
      example: "class UserProfile: pass"
    
    - rule: "Use UPPER_SNAKE_CASE for constants"
      priority: "high"
      example: "MAX_CONNECTIONS = 100"
    
    - rule: "Prefix private methods and attributes with single underscore"
      priority: "high"
      example: "def _internal_method(self): self._private_attr = value"
    
    - rule: "Use descriptive names, avoid single letters except in loops"
      priority: "high"
      example: "for index in range(10): or for item in items:"

  code_organization:
    - rule: "Order imports: standard library, third-party, local modules"
      priority: "high"
      example: "import os\nimport sys\n\nimport requests\n\nfrom myapp import utils"
    
    - rule: "One class per module unless closely related"
      priority: "medium"
      
    - rule: "Keep functions focused and single-purpose"
      priority: "high"
      
    - rule: "Organize code into packages with __init__.py files"
      priority: "medium"

  type_hints:
    - rule: "Use type hints for function parameters and return values"
      priority: "high"
      example: "def get_user(user_id: int) -> User | None:"
    
    - rule: "Use Optional for nullable types"
      priority: "high"
      example: "from typing import Optional\ndef find_user(email: str) -> Optional[User]:"
    
    - rule: "Use List, Dict, Set from typing for collection types"
      priority: "high"
      example: "def process_items(items: List[str]) -> Dict[str, int]:"
    
    - rule: "Use Protocol or ABC for interface definitions"
      priority: "medium"
      example: "from typing import Protocol\nclass Drawable(Protocol): def draw(self) -> None: ..."

  docstrings:
    - rule: "Write docstrings for all public modules, classes, functions"
      priority: "high"
      example: "\"\"\"\n    Get user by ID.\n    \n    Args:\n        user_id: The unique user identifier\n    \n    Returns:\n        User object or None if not found\n    \"\"\""
    
    - rule: "Use Google or NumPy style for docstrings consistently"
      priority: "medium"
      
    - rule: "Include parameter types and return types in docstrings"
      priority: "medium"

  best_practices:
    - rule: "Use context managers (with statement) for resource management"
      priority: "high"
      example: "with open('file.txt', 'r') as f: content = f.read()"
    
    - rule: "Prefer list comprehensions over map/filter for simple operations"
      priority: "medium"
      example: "squared = [x**2 for x in numbers if x > 0]"
    
    - rule: "Use f-strings for string formatting"
      priority: "high"
      example: "message = f'Hello, {name}! You have {count} messages.'"
    
    - rule: "Use enumerate() for index and value in loops"
      priority: "medium"
      example: "for index, item in enumerate(items):"
    
    - rule: "Use zip() for parallel iteration"
      priority: "medium"
      example: "for name, age in zip(names, ages):"
    
    - rule: "Prefer pathlib over os.path for file operations"
      priority: "medium"
      example: "from pathlib import Path\nfile_path = Path('data') / 'users.json'"

  error_handling:
    - rule: "Use specific exception types, avoid bare except"
      priority: "high"
      example: "except ValueError as e: or except (TypeError, KeyError) as e:"
    
    - rule: "Log exceptions with context information"
      priority: "high"
      example: "logger.exception(f'Failed to process user {user_id}')"
    
    - rule: "Create custom exception classes for domain-specific errors"
      priority: "medium"
      example: "class ValidationError(Exception): pass"
    
    - rule: "Use finally for cleanup code"
      priority: "high"
      example: "try: ... except: ... finally: cleanup()"

  data_structures:
    - rule: "Use dataclasses for data containers"
      priority: "medium"
      example: "from dataclasses import dataclass\n@dataclass\nclass User: name: str\n    age: int"
    
    - rule: "Use NamedTuple for immutable data structures"
      priority: "medium"
      example: "from typing import NamedTuple\nclass Point(NamedTuple): x: int\n    y: int"
    
    - rule: "Use Enum for fixed set of constants"
      priority: "medium"
      example: "from enum import Enum\nclass Status(Enum): ACTIVE = 1\n    INACTIVE = 2"

  async_programming:
    - rule: "Use async/await for I/O-bound operations"
      priority: "high"
      example: "async def fetch_data(url: str) -> dict: async with aiohttp.ClientSession() as session:"
    
    - rule: "Use asyncio.gather() for concurrent operations"
      priority: "medium"
      example: "results = await asyncio.gather(task1, task2, task3)"
    
    - rule: "Properly handle exceptions in async code"
      priority: "high"

  testing:
    - rule: "Write unit tests using pytest or unittest"
      priority: "high"
      
    - rule: "Use fixtures for test setup and teardown"
      priority: "high"
      example: "@pytest.fixture\ndef user(): return User(name='Test')"
    
    - rule: "Use descriptive test function names"
      priority: "medium"
      example: "def test_get_user_returns_none_when_not_found():"
    
    - rule: "Use mocking for external dependencies"
      priority: "high"
      example: "from unittest.mock import Mock, patch"
    
    - rule: "Aim for high test coverage but focus on critical paths"
      priority: "medium"

  performance:
    - rule: "Use generators for large datasets to save memory"
      priority: "medium"
      example: "def read_large_file(file_path): for line in file: yield process(line)"
    
    - rule: "Use set for membership testing (O(1) vs O(n) for list)"
      priority: "medium"
      
    - rule: "Use dictionary for lookups instead of nested loops"
      priority: "medium"
      
    - rule: "Profile code before optimizing"
      priority: "high"

  security:
    - rule: "Never store credentials in code, use environment variables"
      priority: "critical"
      example: "import os\napi_key = os.getenv('API_KEY')"
    
    - rule: "Validate and sanitize user input"
      priority: "critical"
      
    - rule: "Use secrets module for cryptographically strong random numbers"
      priority: "high"
      example: "import secrets\ntoken = secrets.token_urlsafe(32)"
    
    - rule: "Avoid eval() and exec() with user input"
      priority: "critical"

  pep8_compliance:
    - rule: "Limit lines to 88-100 characters (Black formatter standard)"
      priority: "medium"
      
    - rule: "Use 4 spaces for indentation, never tabs"
      priority: "high"
      
    - rule: "Use blank lines appropriately (2 before classes/functions, 1 within)"
      priority: "low"
      
    - rule: "Use spaces around operators and after commas"
      priority: "medium"

  dependencies:
    - rule: "Use virtual environments (venv, virtualenv, conda)"
      priority: "high"
      
    - rule: "Pin dependencies with version numbers in requirements.txt"
      priority: "high"
      example: "requests==2.31.0"
    
    - rule: "Use requirements.txt for production, requirements-dev.txt for development"
      priority: "medium"

ai_completion_hints:
  - "Suggest appropriate standard library modules"
  - "Recommend Pythonic idioms and patterns"
  - "Provide type hints for better code completion"
  - "Suggest appropriate exception handling"
  - "Recommend performance optimizations when needed"
