version: "1.0.0"
language: "C#/.NET"
framework: ".NET 6.0+"

naming_conventions:
  classes:
    - rule: "Use PascalCase for class names"
      example: "public class UserRepository"
  interfaces:
    - rule: "Prefix interfaces with 'I'"
      example: "public interface IUserService"
  methods:
    - rule: "Use PascalCase for method names"
      example: "public void ProcessOrder()"
  variables:
    - rule: "Use camelCase for local variables and parameters"
      example: "var userId = 123;"
  constants:
    - rule: "Use PascalCase for constants"
      example: "public const int MaxRetries = 3;"
  private_fields:
    - rule: "Use _camelCase with underscore prefix for private fields"
      example: "private readonly ILogger _logger;"

code_organization:
  file_structure:
    - "One class per file"
    - "File name matches class name"
    - "Use namespaces that match folder structure"
  using_directives:
    - "Place using statements at the top of the file"
    - "Sort using statements alphabetically"
    - "Remove unused using statements"
  class_members_order:
    - "Constants"
    - "Fields"
    - "Constructors"
    - "Properties"
    - "Methods"
    - "Private methods"

best_practices:
  async_await:
    - "Use async/await for asynchronous operations"
    - "Suffix async methods with 'Async'"
    - "Always use ConfigureAwait(false) in library code"
  dependency_injection:
    - "Use constructor injection for dependencies"
    - "Register services in Program.cs or Startup.cs"
    - "Use interfaces for abstraction"
  error_handling:
    - "Use specific exception types"
    - "Don't catch generic exceptions unless necessary"
    - "Always log exceptions with context"
  linq:
    - "Prefer LINQ for collection operations"
    - "Use method syntax for complex queries"
    - "Use query syntax for simple, readable queries"
  nullability:
    - "Enable nullable reference types"
    - "Use null-conditional operators (?. and ??)"
    - "Avoid null reference exceptions"

security:
  - "Never store sensitive data in code"
  - "Use parameterized queries for database access"
  - "Validate all user inputs"
  - "Use Data Annotations for model validation"
  - "Implement authentication and authorization"
  - "Use HTTPS for all communications"

performance:
  - "Use StringBuilder for string concatenation in loops"
  - "Dispose of IDisposable objects properly (using statements)"
  - "Use async methods for I/O operations"
  - "Cache frequently accessed data"
  - "Use value types (structs) for small, immutable data"

testing:
  - "Write unit tests using xUnit, NUnit, or MSTest"
  - "Follow AAA pattern (Arrange, Act, Assert)"
  - "Use meaningful test names: MethodName_Scenario_ExpectedResult"
  - "Mock dependencies using Moq or NSubstitute"
  - "Aim for high code coverage"

documentation:
  - "Use XML documentation comments for public APIs"
  - "Document complex business logic"
  - "Keep comments up-to-date with code changes"
  - "Use clear, concise method and variable names"
