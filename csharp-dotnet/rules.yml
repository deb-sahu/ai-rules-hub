# C#/.NET AI Coding Standards

version: "1.0.0"
language: "csharp"
framework: ".NET"

rules:
  naming_conventions:
    - rule: "Use PascalCase for class names, method names, and public properties"
      priority: "high"
      example: "public class UserService { public string UserName { get; set; } }"
    
    - rule: "Use camelCase for private fields and local variables"
      priority: "high"
      example: "private string userName; var userId = 1;"
    
    - rule: "Prefix interfaces with 'I'"
      priority: "high"
      example: "public interface IUserRepository { }"
    
    - rule: "Use async suffix for asynchronous methods"
      priority: "medium"
      example: "public async Task<User> GetUserAsync(int id)"

  code_organization:
    - rule: "One class per file, file name matches class name"
      priority: "high"
      
    - rule: "Order members: fields, constructors, properties, methods"
      priority: "medium"
      
    - rule: "Group using statements and remove unused ones"
      priority: "medium"

  best_practices:
    - rule: "Use dependency injection for service dependencies"
      priority: "high"
      example: "public UserService(IUserRepository repository, ILogger<UserService> logger)"
    
    - rule: "Always dispose of IDisposable resources using 'using' statement or pattern"
      priority: "high"
      example: "using var connection = new SqlConnection(connectionString);"
    
    - rule: "Use async/await for I/O operations"
      priority: "high"
      
    - rule: "Prefer LINQ for collection operations"
      priority: "medium"
      example: "var activeUsers = users.Where(u => u.IsActive).ToList();"
    
    - rule: "Use nullable reference types and handle null cases"
      priority: "high"
      example: "public string? OptionalValue { get; set; }"

  error_handling:
    - rule: "Use specific exception types, avoid catching generic Exception"
      priority: "high"
      example: "catch (SqlException ex) when (ex.Number == 2601)"
    
    - rule: "Log exceptions with context information"
      priority: "high"
      
    - rule: "Use try-catch only where you can handle the exception"
      priority: "medium"

  testing:
    - rule: "Write unit tests using xUnit, NUnit, or MSTest"
      priority: "high"
      
    - rule: "Follow Arrange-Act-Assert pattern"
      priority: "high"
      
    - rule: "Use meaningful test method names describing the scenario"
      priority: "medium"
      example: "public void GetUser_WhenUserExists_ReturnsUser()"

  performance:
    - rule: "Use StringBuilder for string concatenation in loops"
      priority: "medium"
      
    - rule: "Prefer ValueTask for hot paths in async code"
      priority: "low"
      
    - rule: "Use Span<T> and Memory<T> for performance-critical code"
      priority: "low"

  security:
    - rule: "Never store sensitive data in plain text"
      priority: "critical"
      
    - rule: "Use parameterized queries to prevent SQL injection"
      priority: "critical"
      example: "command.Parameters.AddWithValue(\"@userId\", userId);"
    
    - rule: "Validate and sanitize user input"
      priority: "critical"

ai_completion_hints:
  - "Suggest appropriate design patterns (Repository, Factory, Strategy, etc.)"
  - "Recommend SOLID principles adherence"
  - "Provide XML documentation comments for public APIs"
  - "Suggest appropriate logging levels and messages"
  - "Recommend appropriate exception handling strategies"
